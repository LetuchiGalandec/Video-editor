<div class="markers">
  <div class="marker-group">
    <label class="marker-label" for="mark-in">Start</label>
    <input
      id="mark-in"
      class="marker-field"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      spellcheck="false"
      title="Type a timestamp, or nudge with ↑↓ (±0.1s, ±1s with Shift, ±10s with Page Up/Down)"
      [value]="inText()"
      (change)="commit('in', $any($event.target))"
      (keydown)="onKeydown('in', $event, $any($event.target))"
    />
    <button
      class="from-playhead"
      type="button"
      title="Set start to the playhead"
      (click)="setFromPlayhead('in')"
    >
      ⤓ playhead
    </button>
  </div>

  <div class="selection-length" aria-live="polite">
    <span class="length-value">{{ lengthText() }}</span>
    <span class="length-caption">selected</span>
  </div>

  <div class="marker-group marker-group-end">
    <label class="marker-label" for="mark-out">End</label>
    <input
      id="mark-out"
      class="marker-field"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      spellcheck="false"
      title="Type a timestamp, or nudge with ↑↓ (±0.1s, ±1s with Shift, ±10s with Page Up/Down)"
      [value]="outText()"
      (change)="commit('out', $any($event.target))"
      (keydown)="onKeydown('out', $event, $any($event.target))"
    />
    <button
      class="from-playhead"
      type="button"
      title="Set end to the playhead"
      (click)="setFromPlayhead('out')"
    >
      ⤓ playhead
    </button>
  </div>
</div>
