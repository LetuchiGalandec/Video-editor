<div class="controls">
  <button
    class="ctl"
    type="button"
    (click)="togglePlay.emit()"
    [attr.aria-label]="store.playing() ? 'Pause' : 'Play'"
  >
    @if (store.playing()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="4" width="5" height="16" rx="1.5" />
        <rect x="14" y="4" width="5" height="16" rx="1.5" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4.8c0-1.2 1.3-2 2.4-1.3l11 6.9c1 .6 1 2.1 0 2.7l-11 7c-1 .7-2.4-.1-2.4-1.4z" />
      </svg>
    }
  </button>

  <button
    class="ctl"
    type="button"
    (click)="toggleMute.emit()"
    [attr.aria-label]="store.muted() ? 'Unmute' : 'Mute'"
    [class.muted]="store.muted()"
  >
    @if (store.muted() || store.volume() === 0) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9z" />
        <line x1="16" y1="9" x2="21" y2="15" stroke-width="2.2" stroke-linecap="round" />
        <line x1="21" y1="9" x2="16" y2="15" stroke-width="2.2" stroke-linecap="round" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9z" />
        <path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke-width="2" stroke-linecap="round" />
        <path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round" />
      </svg>
    }
  </button>

  <input
    class="volume"
    type="range"
    min="0"
    max="1"
    step="0.05"
    aria-label="Volume"
    [value]="store.muted() ? 0 : store.volume()"
    (input)="onVolumeInput($event)"
  />

  <span class="timecode">{{ timeLabel() }}</span>
</div>
