server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads are capped at MAX_UPLOAD_BYTES (2 GB by default) server-side; nginx
  # must not reject them first with a 413.
  client_max_body_size 2g;

  # The Angular app calls /api/... with relative URLs, so proxying here keeps
  # everything same-origin and the signed session cookie is sent unchanged.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/jobs/:id/events is Server-Sent Events: buffering would withhold
    # progress until the response ended, so the UI would sit at 0% and then
    # jump to done. Clearing Connection keeps the stream from being closed.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;

    # Fetching and re-encoding a clip can run for minutes; the default 60s
    # read timeout would sever the request mid-job.
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
  }

  # Hashed build assets are immutable; index.html must never be cached or
  # clients keep booting a stale bundle after a redeploy.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: /preview/:id and friends have no file on disk.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
